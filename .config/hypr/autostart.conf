# Execute your favorite apps at launch
# exec-once = waybar & hyprpaper & firefox
# https://github.com/loqusion/hyprshade?tab=readme-ov-file#scheduling:
# import env first, then bring up graphical-session.target (kanshi, udiskie, syncthingtray);
# chained so units with ConditionEnvironment=WAYLAND_DISPLAY see it
exec-once = dbus-update-activation-environment --systemd HYPRLAND_INSTANCE_SIGNATURE WAYLAND_DISPLAY XDG_CURRENT_DESKTOP && systemctl --user start hyprland-session.target
exec-shutdown = systemctl --user stop graphical-session.target
exec-once = noctalia
exec-once = hypridle
exec-once = wlsunset -l 49.2 -L 16.6
exec-once = systemctl --user start hyprpolkitagent # https://wiki.hypr.land/Hypr-Ecosystem/hyprpolkitagent/#usage
#exec-once = nm-applet
#exec-once = blueman-applet
#exec-once = hyprpaper
