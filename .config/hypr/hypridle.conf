# Keyboard backlight only — uses ignore_inhibit so keys still dim during video playback.
# Lock, screen-off, and suspend are handled by Noctalia idle (see modules/home/thinkpad.nix).
general {
    lock_cmd = noctalia msg session lock
    before_sleep_cmd = noctalia msg session lock
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 30
    on-timeout = brightnessctl -sd tpacpi::kbd_backlight set 0
    on-resume = brightnessctl -rd tpacpi::kbd_backlight
    ignore_inhibit = true
}
